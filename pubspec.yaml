name: draggable_menu_anchor
description: >-
  A MenuAnchor-style pop-up you can drag around: opens at the tap with
  MenuAnchor's placement rules, stays on screen, closes on an outside tap.
version: 1.0.1
homepage: https://github.com/selvan/draggable_menu_anchor
repository: https://github.com/selvan/draggable_menu_anchor
issue_tracker: https://github.com/selvan/draggable_menu_anchor/issues
topics:
  - menu
  - popup
  - draggable
  - overlay
  - widget

environment:
  sdk: '^3.8.0'
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
